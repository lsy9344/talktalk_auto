  - id: "OPS-001"
    severity: low
    finding: "tokens를 문자/4로 근사합니다. 한국어 문서에서는 실제 토큰 수와 차이가 날 수 있어, 운영에서 청크 크기 분포를 한 번 확인하는 게 안전합니다."
    suggested_action: "운영에서 청크 길이/임베딩 비용을 모니터링하고, 필요하면 tiktoken 같은 실제 tokenizer 옵션을 검토하세요."
  - id: "REL-001"
    severity: low
    finding: "Indexer는 임베딩에 `chunk.text`만 쓰고, 청크 JSON은 청크 리스트 전체를 저장합니다(현재 구현에서는 항상 일치)."
    suggested_action: "안전장치로 '빈 텍스트 청크가 없도록' assert/필터를 추가하면 더 안전합니다(선택)."
  - id: "TEST-001"
    severity: low
    finding: "`chunk_sections()`의 '400~800 tokens 근처'는 `chunk_text()` 테스트로 간접 확인합니다."
    suggested_action: "`chunk_sections()`도 토큰 근사 범위 테스트를 추가하면 요구사항 추적이 더 명확해집니다(선택)."

