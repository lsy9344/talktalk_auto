AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TalkTalk Auto - Naver TalkTalk AI Customer Support System

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        CHANNEL_CONFIG_TABLE: !Ref ChannelConfigTable
        DEDUPLICATION_TABLE: !Ref DeduplicationTable
        GLOBAL_MODE_TABLE: !Ref GlobalModeTable
        AGGREGATION_STATE_TABLE: !Ref AggregationStateTable
        VECTOR_INDEX_METADATA_TABLE: !Ref VectorIndexMetadataTable
        VECTOR_INDEX_BUCKET: !Ref VectorIndexBucket
        WORKER_QUEUE_URL: !Ref WorkerQueue
        AGGREGATION_TRIGGER_QUEUE_URL: !Ref AggregationTriggerQueue
        ENABLE_MESSAGE_AGGREGATION: 'false'
        AGGREGATION_WINDOW_SECONDS: '30'
        MAX_MESSAGES_PER_AGGREGATION: '10'
        LOG_LEVEL: INFO
        SERVICE_NAME: talktalk-auto
        TELEGRAM_CHAT_ID: '{{resolve:ssm:/talktalk-auto/telegram-chat-id:1}}'

Resources:
  # ========================================
  # DynamoDB Tables
  # ========================================

  ChannelConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-ChannelConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: channel_id
          AttributeType: S
      KeySchema:
        - AttributeName: channel_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: false

  DeduplicationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Deduplication
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dedup_key
          AttributeType: S
      KeySchema:
        - AttributeName: dedup_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  GlobalModeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-GlobalMode
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH

  AggregationStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-AggregationState
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: aggregation_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: aggregation_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: aggregation_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  VectorIndexMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-VectorIndexMetadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doc_id
          AttributeType: S
      KeySchema:
        - AttributeName: doc_id
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: false

  # ========================================
  # S3 Bucket
  # ========================================

  VectorIndexBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-vectorindex-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldIndices
            Status: Disabled
            ExpirationInDays: 90

  # ========================================
  # SQS Queue
  # ========================================

  WorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-WorkerQueue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600  # 14 days
      ReceiveMessageWaitTimeSeconds: 20

  AggregationTriggerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-AggregationTriggerQueue
      DelaySeconds: 30
      VisibilityTimeout: 60
      MessageRetentionPeriod: 300  # 5 minutes
      ReceiveMessageWaitTimeSeconds: 0

  # ========================================
  # Lambda Layer (Shared Library)
  # ========================================

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-SharedLayer
      Description: Shared libraries for TalkTalk Auto
      ContentUri: ../src/layers/shared
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

  # ========================================
  # Lambda Functions
  # ========================================

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-IngestFunction
      CodeUri: ../src/functions/ingest
      Handler: app.lambda_handler
      Timeout: 10
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChannelConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeduplicationTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WorkerQueue.QueueName
      Events:
        WebhookApi:
          Type: Api
          Properties:
            Path: /naver/talktalk/{channel_id}/webhook
            Method: POST
            RestApiId: !Ref WebhookApi

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-WorkerFunction
      CodeUri: ../src/functions/worker
      Handler: app.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChannelConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref GlobalModeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AggregationStateTable
        - DynamoDBReadPolicy:
            TableName: !Ref VectorIndexMetadataTable
        - S3ReadPolicy:
            BucketName: !Ref VectorIndexBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AggregationTriggerQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:OPENAI_API_KEY-*
      Events:
        WorkerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WorkerQueue.Arn
            BatchSize: 1
        AggregationTriggerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AggregationTriggerQueue.Arn
            BatchSize: 1

  IndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-IndexerFunction
      CodeUri: ../src/functions/indexer
      Handler: app.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ChannelConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref GlobalModeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VectorIndexMetadataTable
        - S3CrudPolicy:
            BucketName: !Ref VectorIndexBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:GOOGLE_SA_JSON-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:OPENAI_API_KEY-*
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 ? * MON *)
            Description: Weekly KB document sync (every Monday at 3 AM UTC)
            Enabled: true

  # ========================================
  # API Gateway
  # ========================================

  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-WebhookApi
      StageName: prod
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

Outputs:
  WebhookApiUrl:
    Description: Webhook API Gateway URL
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/prod/naver/talktalk/{channel_id}/webhook

  IngestFunctionArn:
    Description: Ingest Lambda Function ARN
    Value: !GetAtt IngestFunction.Arn

  WorkerQueueUrl:
    Description: Worker Queue URL
    Value: !Ref WorkerQueue

  ChannelConfigTableName:
    Description: ChannelConfig Table Name
    Value: !Ref ChannelConfigTable

  DeduplicationTableName:
    Description: Deduplication Table Name
    Value: !Ref DeduplicationTable

  GlobalModeTableName:
    Description: GlobalMode Table Name
    Value: !Ref GlobalModeTable
